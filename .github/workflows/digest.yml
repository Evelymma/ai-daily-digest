name: AI Daily Digest

on:
  schedule:
    - cron: '0 23 * * *'  # 日本时间每天 08:00 (JST = UTC+9)
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun add nodemailer

      - name: Generate Daily Digest and Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAIL_SENDER_EMAIL: ${{ secrets.MAIL_SENDER_EMAIL }}
          MAIL_SENDER_PASSWORD: ${{ secrets.MAIL_SENDER_PASSWORD }}
          MAIL_RECIPIENT: ${{ secrets.MAIL_RECIPIENT }}
        run: |
          npx -y bun scripts/digest.ts \
            --hours 48 \
            --top-n 15 \
            --lang zh \
            --output ./digest-$(date +%Y%m%d).md

      - name: Push digest to news-vault repo
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          # 计算年月，用于创建子文件夹，例如 2025/05
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          FILENAME="digest-$(date +%Y%m%d).md"

          # 克隆目标仓库
          git clone https://x-access-token:${VAULT_TOKEN}@github.com/Evelymma/ai-daily-digest-news-vault.git vault-repo

          # 创建年月文件夹（如果不存在）
          mkdir -p vault-repo/${YEAR}/${MONTH}

          # 复制日报文件到对应目录
          cp ${FILENAME} vault-repo/${YEAR}/${MONTH}/${FILENAME}

          # 提交并推送
          cd vault-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "digest: ${FILENAME}"
          git push

      - name: Upload Digest as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest
          path: digest-*.md
          retention-days: 30
